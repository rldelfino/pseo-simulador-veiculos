<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Playfair Display';font-weight:600 700;src:url('data:font/woff2;base64,@@PLAYFAIR@@') format('woff2')}
@font-face{font-family:'Inter';font-weight:300 700;src:url('data:font/woff2;base64,@@INTER@@') format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;background:#020617;background-image:radial-gradient(at 80% 0%,#1e293b 0,transparent 55%),radial-gradient(at 0% 100%,#06233a 0,transparent 55%);color:#f8fafc;font-family:'Inter',sans-serif;padding:66px 80px;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:22px}
.tile{width:140px;height:140px;border-radius:38px;display:grid;place-items:center;color:#0ea5e9;background:linear-gradient(145deg,rgba(14,165,233,.16),rgba(15,23,42,.6));border:2px solid rgba(14,165,233,.42);box-shadow:0 0 60px -10px rgba(14,165,233,.5)}
.wm b{display:block;font-size:54px;font-weight:700;letter-spacing:-.02em}.wm i{display:block;font-style:normal;font-size:19px;letter-spacing:.44em;color:#0ea5e9;margin-top:10px;font-weight:600}
.prod{margin-left:18px;padding-left:24px;border-left:2px solid rgba(255,255,255,.14);font-size:30px;color:#a3b1c6}
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:74px;line-height:1.08;margin-top:46px;max-width:1000px}
h1 em{font-style:normal;color:#0ea5e9}
p{margin-top:24px;font-size:29px;color:#a3b1c6}
.chips{position:absolute;left:80px;bottom:52px;display:flex;gap:14px}
.chips span{border:1.5px solid rgba(14,165,233,.4);background:rgba(14,165,233,.1);color:#7dd3fc;border-radius:99px;padding:8px 22px;font-size:22px;font-weight:600}
.url{position:absolute;right:80px;bottom:56px;font-size:22px;color:#8a99ae;letter-spacing:.04em}
</style></head><body>
<div class="top"><span class="tile">@@LOGO@@</span><span class="wm"><b>Datalab</b><i>GLOBAL</i></span><span class="prod">Veículos</span></div>
<h1>Simulador de financiamento de <em>veículos</em></h1>
<p>Parcela, CET e custo total de carro novo, usado e moto, com as taxas do Banco Central.</p>
<div class="chips"><span>Carro novo</span><span>Carro usado</span><span>Moto</span></div>
<div class="url">veiculos.datalabglobal.com</div>
</body></html>
